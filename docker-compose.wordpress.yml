services:
  wordpress-db:
    image: mariadb:11.4
    restart: unless-stopped
    env_file:
      - .env.wordpress
    environment:
      MARIADB_DATABASE: ${WORDPRESS_DB_NAME}
      MARIADB_USER: ${WORDPRESS_DB_USER}
      MARIADB_PASSWORD: ${WORDPRESS_DB_PASSWORD}
      MARIADB_ROOT_PASSWORD: ${WORDPRESS_DB_ROOT_PASSWORD}
    volumes:
      - wordpress_db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 10

  wordpress:
    image: wordpress:6.8-php8.3-apache
    restart: unless-stopped
    depends_on:
      wordpress-db:
        condition: service_healthy
    env_file:
      - .env.wordpress
    environment:
      WORDPRESS_DB_HOST: wordpress-db:3306
      WORDPRESS_DB_NAME: ${WORDPRESS_DB_NAME}
      WORDPRESS_DB_USER: ${WORDPRESS_DB_USER}
      WORDPRESS_DB_PASSWORD: ${WORDPRESS_DB_PASSWORD}
      FASTBYTE_HEADLESS_WEBHOOK_URL: ${FASTBYTE_HEADLESS_WEBHOOK_URL}
      FASTBYTE_HEADLESS_WEBHOOK_SECRET: ${FASTBYTE_HEADLESS_WEBHOOK_SECRET}
    ports:
      - "${WORDPRESS_PORT:-8080}:80"
    volumes:
      - wordpress_files:/var/www/html
      - ./wordpress-plugin/fastbyte-headless:/var/www/html/wp-content/plugins/fastbyte-headless:ro

  wordpress-cli:
    image: wordpress:cli-php8.3
    profiles: ["tools"]
    depends_on:
      wordpress-db:
        condition: service_healthy
      wordpress:
        condition: service_started
    env_file:
      - .env.wordpress
    environment:
      WORDPRESS_DB_HOST: wordpress-db:3306
      WORDPRESS_DB_NAME: ${WORDPRESS_DB_NAME}
      WORDPRESS_DB_USER: ${WORDPRESS_DB_USER}
      WORDPRESS_DB_PASSWORD: ${WORDPRESS_DB_PASSWORD}
    user: "33:33"
    volumes:
      - wordpress_files:/var/www/html
      - ./wordpress-plugin/fastbyte-headless:/var/www/html/wp-content/plugins/fastbyte-headless:ro

volumes:
  wordpress_db_data:
  wordpress_files:
