name: fullstack-app

services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD in .env}
      MYSQL_DATABASE: ${MYSQL_DATABASE:?Set MYSQL_DATABASE in .env}
      MYSQL_USER: ${MYSQL_USER:?Set MYSQL_USER in .env}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?Set MYSQL_PASSWORD in .env}
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --skip-name-resolve
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - app_network
    healthcheck:
      # MYSQL_PWD avoids exposing the password as a mysqladmin command argument.
      test: ["CMD-SHELL", "MYSQL_PWD=$${MYSQL_ROOT_PASSWORD} mysqladmin ping --host=127.0.0.1 --user=root --silent"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    stop_grace_period: 60s
    security_opt:
      - no-new-privileges:true

  wordpress:
    image: wordpress:php8.3-apache
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      WORDPRESS_DB_HOST: ${WORDPRESS_DB_HOST:-mysql:3306}
      WORDPRESS_DB_NAME: ${WORDPRESS_DB_NAME:?Set WORDPRESS_DB_NAME in .env}
      WORDPRESS_DB_USER: ${WORDPRESS_DB_USER:?Set WORDPRESS_DB_USER in .env}
      WORDPRESS_DB_PASSWORD: ${WORDPRESS_DB_PASSWORD:?Set WORDPRESS_DB_PASSWORD in .env}
      WORDPRESS_TABLE_PREFIX: ${WORDPRESS_TABLE_PREFIX:-wp_}
      WORDPRESS_DEBUG: ${WORDPRESS_DEBUG:-false}
      ADMIN_DOMAIN: ${ADMIN_DOMAIN:?Set ADMIN_DOMAIN in .env}
      # Trust HTTPS only when Nginx supplies the reverse-proxy protocol header.
      WORDPRESS_CONFIG_EXTRA: |
        if (isset($$_SERVER['HTTP_X_FORWARDED_PROTO']) && strpos($$_SERVER['HTTP_X_FORWARDED_PROTO'], 'https') !== false) {
          $$_SERVER['HTTPS'] = 'on';
        }
        define('WP_HOME', 'https://' . getenv('ADMIN_DOMAIN'));
        define('WP_SITEURL', 'https://' . getenv('ADMIN_DOMAIN'));
        define('FORCE_SSL_ADMIN', true);
        define('DISALLOW_FILE_EDIT', true);
        define('WP_AUTO_UPDATE_CORE', 'minor');
        define('WP_ENVIRONMENT_TYPE', 'production');
    volumes:
      # Preserve installed themes/plugins and keep media in its own backup unit.
      - wordpress_data:/var/www/html
      - wordpress_uploads:/var/www/html/wp-content/uploads
      - ./wordpress/php.ini:/usr/local/etc/php/conf.d/zz-production.ini:ro
    networks:
      - app_network
    healthcheck:
      test: ["CMD", "php", "-r", "exit(@fsockopen('127.0.0.1', 80) ? 0 : 1);"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s
    stop_grace_period: 30s
    security_opt:
      - no-new-privileges:true

  nextjs:
    build:
      context: .
      dockerfile: nextjs/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:?Set NEXT_PUBLIC_API_URL in .env}
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:?Set NEXT_PUBLIC_SITE_URL in .env}
        NEXT_PUBLIC_ASSET_BASE_URL: ${NEXT_PUBLIC_ASSET_BASE_URL:?Set NEXT_PUBLIC_ASSET_BASE_URL in .env}
        NEXT_PUBLIC_ALLOW_INDEXING: ${NEXT_PUBLIC_ALLOW_INDEXING:-false}
        WORDPRESS_API_URL: ${WORDPRESS_API_URL:?Set WORDPRESS_API_URL in .env}
        WORDPRESS_SITE_URL: ${WORDPRESS_SITE_URL:?Set WORDPRESS_SITE_URL in .env}
    restart: unless-stopped
    depends_on:
      wordpress:
        condition: service_healthy
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      HOSTNAME: 0.0.0.0
      PORT: 3000
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:?Set NEXT_PUBLIC_API_URL in .env}
      NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:?Set NEXT_PUBLIC_SITE_URL in .env}
      NEXT_PUBLIC_ASSET_BASE_URL: ${NEXT_PUBLIC_ASSET_BASE_URL:?Set NEXT_PUBLIC_ASSET_BASE_URL in .env}
      NEXT_PUBLIC_ALLOW_INDEXING: ${NEXT_PUBLIC_ALLOW_INDEXING:-false}
      WORDPRESS_API_URL: ${WORDPRESS_API_URL:?Set WORDPRESS_API_URL in .env}
      WORDPRESS_SITE_URL: ${WORDPRESS_SITE_URL:?Set WORDPRESS_SITE_URL in .env}
      WORDPRESS_REVALIDATE_SECRET: ${WORDPRESS_REVALIDATE_SECRET:?Set WORDPRESS_REVALIDATE_SECRET in .env}
      WORDPRESS_PREVIEW_SECRET: ${WORDPRESS_PREVIEW_SECRET:?Set WORDPRESS_PREVIEW_SECRET in .env}
    networks:
      - app_network
    healthcheck:
      test: ["CMD", "node", "-e", "const s=require('net').connect(3000,'127.0.0.1');s.on('connect',()=>process.exit(0));s.on('error',()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    stop_grace_period: 30s
    security_opt:
      - no-new-privileges:true

  nginx:
    image: nginx:1.28-alpine
    restart: unless-stopped
    depends_on:
      nextjs:
        condition: service_healthy
      wordpress:
        condition: service_healthy
    environment:
      # The official Nginx entrypoint substitutes these in app.conf at startup.
      APP_DOMAIN: ${APP_DOMAIN:?Set APP_DOMAIN in .env}
      ADMIN_DOMAIN: ${ADMIN_DOMAIN:?Set ADMIN_DOMAIN in .env}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/conf.d/app.conf:/etc/nginx/templates/default.conf.template:ro
      - ./nginx/certs:/etc/nginx/certs:ro
    networks:
      - app_network
    healthcheck:
      test: ["CMD-SHELL", "wget --quiet --spider http://127.0.0.1/nginx-health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    stop_grace_period: 30s
    security_opt:
      - no-new-privileges:true

networks:
  app_network:
    driver: bridge

volumes:
  mysql_data:
  wordpress_data:
  wordpress_uploads:
