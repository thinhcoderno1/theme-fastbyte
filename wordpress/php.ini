; WordPress production upload and execution limits.
file_uploads = On
upload_max_filesize = 128M
post_max_size = 128M
memory_limit = 256M
max_execution_time = 300
max_input_time = 300
max_input_vars = 5000

; Do not disclose PHP details in HTTP responses.
expose_php = Off
display_errors = Off
log_errors = On
